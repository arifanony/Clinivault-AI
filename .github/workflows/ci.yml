# Clinivault AI CI (M7, DECISION-021).
#
# Runs the repository unittest gate on every push and pull request.
# E5 model tests skip automatically when the Hugging Face cache is
# absent; no live Gemini calls run in the gate.

name: ci

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run python -m unittest discover -s tests
